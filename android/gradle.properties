# 4 GB, not the 2 GB this had: on the v1.9.1 tag `collectReleaseDependencies`
# died with OutOfMemoryError, assembleRelease failed, and the release job
# quietly shipped the debug APK instead (it is built first and the Collect
# step falls back to it). The runner has far more than this to give.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
