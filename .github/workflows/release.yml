name: Build & Release

# Builds IRNetFree for Windows, macOS (Intel + Apple Silicon) and Linux, then
# attaches every installer to the GitHub Release for the pushed tag.
#
# Trigger: push a version tag, e.g.
#   git tag v0.5.0
#   git push origin v0.5.0
# A tag with a suffix (v0.5.0-beta.1) is published as a PRE-release.
# (You can also run it manually from the Actions tab — it will only build,
#  without publishing, when there is no tag.)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npx electron-builder --win --publish never
          - os: macos-latest
            build: npx electron-builder --mac --publish never
          - os: ubuntu-latest
            build: npx electron-builder --linux --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
          # AppImage needs FUSE; install whichever package the runner provides.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run gen-icons

      - name: Build
        env:
          # Let appimagetool run without a FUSE mount (CI has no /dev/fuse).
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # electron-builder is called directly (not via `npm run … --`) so the
        # `--publish never` flag is parsed consistently on every runner shell.
        # `--publish never` is REQUIRED: on a tag build electron-builder would
        # otherwise try to auto-publish and fail because no GH_TOKEN is set
        # here (publishing is handled by the dedicated step below).
        run: ${{ matrix.build }}

      # The app verifies an in-app update against these before it opens the
      # installer (src/main/appUpdate.js). One file per runner; the app reads
      # every SHA256SUMS-*.txt on the release.
      #
      # GitHub runs a `bash` step without a profile, and on the Windows runner
      # that PATH has no perl `shasum` (v1.5.0 shipped with no Windows
      # installer because this step failed on it). coreutils `sha256sum` is
      # there on Windows and Linux; macOS has only `shasum`, so it is the
      # fallback. The app's parser accepts both output forms.
      #
      # continue-on-error: the installers are the release; a missing checksum
      # file only makes the in-app update show the file instead of opening it.
      - name: Checksums
        shell: bash
        continue-on-error: true
        run: |
          cd dist
          out="SHA256SUMS-${{ matrix.os }}.txt"
          : > "$out"
          for f in *.exe *.dmg *.zip *.AppImage *.deb; do
            [ -f "$f" ] || continue
            sha256sum "$f" >> "$out" 2>/dev/null || shasum -a 256 "$f" >> "$out"
          done
          cat "$out"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (v1.18.0-beta.1) is a pre-release: the in-app
          # update checks ask for releases/latest, which never names one, so
          # only those who download it on purpose get it. Every job says the
          # same, whichever creates the release first.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/SHA256SUMS-*.txt
          fail_on_unmatched_files: false

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # An explicit package list, because the action's default is
          # `tools platform-tools` and Google removed the deprecated `tools`
          # package from the SDK repository (android-actions/setup-android
          # #537, #538, filed 2026-09-15/16). Every Android job started
          # failing at SDK setup on 2026-09-16 with no change of ours; the
          # Gradle build downloads the platform and build-tools it needs by
          # itself, so platform-tools is all this step has to install.
          packages: platform-tools

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: true

      - name: Fetch native libs (libv2ray)
        run: bash scripts/fetch-libs.sh

      - name: Build tun2socks (hev-socks5-tunnel from source)
        id: hev
        continue-on-error: true
        run: |
          set -o pipefail
          {
            set -e
            HEV_TAG=2.16.0
            work="$RUNNER_TEMP/hev"
            rm -rf "$work"; mkdir -p "$work"; cd "$work"
            echo "== cloning hev-socks5-tunnel $HEV_TAG =="
            git clone --recursive --depth 1 --branch "$HEV_TAG" https://github.com/heiher/hev-socks5-tunnel jni
            echo "== ndk-build (arm64-v8a armeabi-v7a x86_64) =="
            ndk-build -j"$(nproc)" APP_ABI="arm64-v8a armeabi-v7a x86_64" APP_PLATFORM=android-29
            echo "== copying .so into jniLibs =="
            for abi in arm64-v8a armeabi-v7a x86_64; do
              dst="$GITHUB_WORKSPACE/android/app/src/main/jniLibs/$abi"
              mkdir -p "$dst"
              cp "$work/libs/$abi/libhev-socks5-tunnel.so" "$dst/"
              ls -la "$dst/libhev-socks5-tunnel.so"
            done
            echo "== hev tun2socks built OK =="
          } 2>&1 | tee "$GITHUB_WORKSPACE/android/hev-build.txt"

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            # all four or nothing: with one missing, Gradle silently signs with the
            # runner's throwaway debug key again — every release a different
            # certificate, and phones refuse the update ("package appears to be invalid")
            if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set but ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS or ANDROID_KEY_PASSWORD is empty — add all four secrets."
              exit 1
            fi
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "No keystore secret — will produce a debug-signed APK."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.9.0' }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # strip a leading "v" from the tag for versionName
          export VERSION_NAME="${VERSION_NAME#v}"
          # Build both variants; skip lintVitalRelease and keep going so a debug
          # APK is still produced even if the release variant hits a snag.
          # Capture output so failures can be surfaced (build-log step below).
          set -o pipefail
          # lint is disabled in build.gradle (checkReleaseBuilds=false), so we must
          # NOT reference lintVitalRelease here (the task no longer exists).
          gradle --no-daemon --stacktrace --continue \
            assembleDebug assembleRelease 2>&1 | tee build-log.txt || true

      - name: Upload build log to Release (diagnostics)
        if: always() && startsWith(github.ref, 'refs/tags/')
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (v1.18.0-beta.1) is a pre-release: the in-app
          # update checks ask for releases/latest, which never names one, so
          # only those who download it on purpose get it. Every job says the
          # same, whichever creates the release first.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            android/build-log.txt
            android/hev-build.txt
          fail_on_unmatched_files: false

      - name: Collect APK
        id: apk
        env:
          KEYSTORE_PATH: ${{ steps.keystore.outputs.path }}
        run: |
          # Prefer the release APK, fall back to debug so a tag always has
          # something installable — but SAY SO. v1.9.1 shipped a debug APK
          # because assembleRelease had died of OutOfMemoryError and this step
          # said nothing louder than one line in a 3000-line log.
          src="$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n1)"
          variant=release
          if [ -z "$src" ]; then
            src="$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n1)"
            variant=debug
          fi
          if [ -z "$src" ]; then echo "No APK was produced" >&2; exit 1; fi
          ver="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || ver="ci"
          out="IRNetFree-${ver}.apk"
          cp "$src" "$out"
          echo "file=android/$out" >> "$GITHUB_OUTPUT"
          echo "variant=$variant" >> "$GITHUB_OUTPUT"
          echo "Built $out from $src"
          if [ "$variant" = debug ] && [ -n "${KEYSTORE_PATH:-}" ] && [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            # with the real key configured a tag must ship the release build: the
            # debug APK carries the runner's throwaway certificate, which no phone
            # with the real one installed accepts as an update
            echo "::error::assembleRelease produced no APK and a release key is configured — refusing to publish the debug build (it would not install over the real one). Check the Gradle output above."
            exit 1
          fi
          if [ "$variant" = debug ]; then
            echo "::error::assembleRelease produced no APK — this release carries the DEBUG build. Check the Gradle output above (it was an OutOfMemoryError last time)."
            echo "⚠ **The APK in this release is the debug build** — \`assembleRelease\` failed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "APK: release variant, $(du -h "$out" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Verify the APK's certificate (release key)
        if: steps.keystore.outputs.path != ''
        env:
          # the public SHA-256 of IRNetFree's permanent release certificate (CN=IRNetFree,
          # valid until 2054); a different one means the build was not signed with it
          EXPECTED_CERT_SHA256: aabda682057fde3ea565c0d972ea103eed0d6c9ee20232bee98f0b6fc8ce3fc6
        run: |
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(ls -d "$sdk"/build-tools/*/ 2>/dev/null | sort -V | tail -n1)apksigner"
          [ -x "$apksigner" ] || { echo "::error::apksigner not found under $sdk/build-tools"; exit 1; }
          out="$("$apksigner" verify --print-certs "$GITHUB_WORKSPACE/${{ steps.apk.outputs.file }}" 2>&1)" || { echo "$out"; echo "::error::apksigner could not verify the APK"; exit 1; }
          echo "$out" | grep -E 'Signer #1 certificate (DN|SHA-256)' || true
          got="$(echo "$out" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ' :' | tr 'A-F' 'a-f')"
          if [ "$got" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::the APK is signed with $got, not IRNetFree's release certificate $EXPECTED_CERT_SHA256"
            exit 1
          fi
          echo "APK signed with IRNetFree's release certificate ($got)" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-Android
          path: android/IRNetFree-*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (v1.18.0-beta.1) is a pre-release: the in-app
          # update checks ask for releases/latest, which never names one, so
          # only those who download it on purpose get it. Every job says the
          # same, whichever creates the release first.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: android/IRNetFree-*.apk
          fail_on_unmatched_files: false

  openwrt:
    # The router package: architecture `all` (nothing compiled), built by
    # openwrt/build-ipk.js from the same checkout as the desktop installers.
    name: Build OpenWrt package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      # Every file in the package carries the tagged commit's time, not 1970:
      # uhttpd serves LuCI's views with their mtime as Last-Modified and no
      # Cache-Control, so a browser keeps them fresh for a tenth of their age —
      # stamped 1970, years: after an upgrade it went on running the old views.
      # The assignment stands alone so that a failing `git log` fails the step.
      - name: Build ipk
        shell: bash
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          export SOURCE_DATE_EPOCH
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH (the time of the commit being released)"
          node openwrt/build-ipk.js dist
          cd dist
          sha256sum irnetfree_*_all.ipk > SHA256SUMS-openwrt.txt
          cat SHA256SUMS-openwrt.txt
          echo "OpenWrt package: $(ls irnetfree_*_all.ipk) ($(du -h irnetfree_*_all.ipk | cut -f1))" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-OpenWrt
          path: |
            dist/irnetfree_*_all.ipk
            dist/SHA256SUMS-openwrt.txt
          if-no-files-found: error

      - name: Publish package to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # A tag with a suffix (v1.18.0-beta.1) is a pre-release: the in-app
          # update checks ask for releases/latest, which never names one, so
          # only those who download it on purpose get it. Every job says the
          # same, whichever creates the release first.
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/irnetfree_*_all.ipk
            dist/SHA256SUMS-openwrt.txt
          fail_on_unmatched_files: true
