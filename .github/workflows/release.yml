name: Build & Release

# Builds IRNetFree for Windows, macOS (Intel + Apple Silicon) and Linux, then
# attaches every installer to the GitHub Release for the pushed tag.
#
# Trigger: push a version tag, e.g.
#   git tag v0.5.0
#   git push origin v0.5.0
# (You can also run it manually from the Actions tab — it will only build,
#  without publishing, when there is no tag.)

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            build: npx electron-builder --win --publish never
          - os: macos-latest
            build: npx electron-builder --mac --publish never
          - os: ubuntu-latest
            build: npx electron-builder --linux --publish never

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux packaging tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg
          # AppImage needs FUSE; install whichever package the runner provides.
          sudo apt-get install -y libfuse2t64 || sudo apt-get install -y libfuse2 || true

      - name: Sync version to tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"

      - name: Install dependencies
        run: npm install

      - name: Generate icons
        run: npm run gen-icons

      - name: Build
        env:
          # Let appimagetool run without a FUSE mount (CI has no /dev/fuse).
          APPIMAGE_EXTRACT_AND_RUN: '1'
        # electron-builder is called directly (not via `npm run … --`) so the
        # `--publish never` flag is parsed consistently on every runner shell.
        # `--publish never` is REQUIRED: on a tag build electron-builder would
        # otherwise try to auto-publish and fail because no GH_TOKEN is set
        # here (publishing is handled by the dedicated step below).
        run: ${{ matrix.build }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: ignore

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
          fail_on_unmatched_files: false

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Fetch native libs (libv2ray + tun2socks)
        env:
          # Optional: point these at prebuilt libhev-socks5-tunnel.so URLs to
          # bundle the runtime tunnel. Without them the APK still builds; the
          # TUN just won't start until the .so is present.
          HEV_SO_URL_ARM64_V8A: ${{ vars.HEV_SO_URL_ARM64_V8A }}
          HEV_SO_URL_ARMEABI_V7A: ${{ vars.HEV_SO_URL_ARMEABI_V7A }}
          HEV_SO_URL_X86_64: ${{ vars.HEV_SO_URL_X86_64 }}
        run: bash scripts/fetch-libs.sh

      - name: Decode release keystore (if configured)
        id: keystore
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "Release keystore configured."
          else
            echo "No keystore secret — will produce a debug-signed APK."
          fi

      - name: Build APK
        env:
          VERSION_NAME: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '0.9.0' }}
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # strip a leading "v" from the tag for versionName
          export VERSION_NAME="${VERSION_NAME#v}"
          # Build both variants; skip lintVitalRelease and keep going so a debug
          # APK is still produced even if the release variant hits a snag.
          gradle --no-daemon --stacktrace --continue \
            assembleDebug assembleRelease -x lintVitalRelease || true

      - name: Collect APK
        id: apk
        run: |
          # prefer the release APK, fall back to debug — whichever was produced
          src="$(find app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -n1)"
          [ -n "$src" ] || src="$(find app/build/outputs/apk/debug -name '*.apk' 2>/dev/null | head -n1)"
          if [ -z "$src" ]; then echo "No APK was produced" >&2; exit 1; fi
          ver="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF_TYPE:-}" = "tag" ] || ver="ci"
          out="IRNetFree-${ver}.apk"
          cp "$src" "$out"
          echo "file=android/$out" >> "$GITHUB_OUTPUT"
          echo "Built $out from $src"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-Android
          path: android/IRNetFree-*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/IRNetFree-*.apk
          fail_on_unmatched_files: false
