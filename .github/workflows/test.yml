name: Tests

# Unit tests on every push and PR, on all three desktop platforms — the parser,
# config builder and engine choice must behave identically everywhere.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node --test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test "tests/*.test.js"` needs glob support (added in Node 21).
          node-version: '22'
      # No `npm ci` on purpose — the tests use only Node core modules.
      - run: npm test

  cores:
    # The only place a core is handed what this app writes: every config shape
    # (plans, DNS modes, TUN, the v1.18 link forms) through `xray run -test` on
    # the suggested Xray and Xray-PattN, the TUN configs and every TUIC / AnyTLS
    # config (sing-box's alone) through `sing-box check`.
    # The versions come from src/main/coreVersions.js, so a bump is checked here.
    name: cores accept the configs (suggested versions)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the suggested cores
        run: |
          set -euo pipefail
          XV=$(node -p "require('./src/main/coreVersions').SUGGESTED.xray")
          PV=$(node -p "require('./src/main/coreVersions').SUGGESTED['xray-pattn']")
          SV=$(node -p "require('./src/main/coreVersions').SUGGESTED['sing-box']")
          echo "xray $XV · xray-pattn $PV · sing-box $SV"
          mkdir -p "$RUNNER_TEMP/x" "$RUNNER_TEMP/p" "$RUNNER_TEMP/s"
          curl -fsSL --retry 3 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v$XV/Xray-linux-64.zip"
          unzip -q x.zip -d "$RUNNER_TEMP/x"
          curl -fsSL --retry 3 -o p.zip "https://github.com/patterniha/Xray-core/releases/download/v$PV/Xray-linux-64.zip"
          unzip -q p.zip -d "$RUNNER_TEMP/p"
          curl -fsSL --retry 3 -o s.tgz "https://github.com/SagerNet/sing-box/releases/download/v$SV/sing-box-$SV-linux-amd64.tar.gz"
          tar -xzf s.tgz -C "$RUNNER_TEMP/s" --strip-components=1
          chmod +x "$RUNNER_TEMP/x/xray" "$RUNNER_TEMP/p/xray" "$RUNNER_TEMP/s/sing-box"
      - name: Xray (suggested) accepts every config, sing-box every TUN and TUIC / AnyTLS config
        run: IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" node scripts/validate-configs.js
      - name: Xray-PattN (suggested) accepts every config
        # also when the official core refused something: one run says it for both
        if: ${{ !cancelled() }}
        run: IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" node scripts/validate-configs.js
      - name: A WireGuard base that is also the exit is one session (a real peer, loopback)
        # scripts/probe-wg-base.js: a WireGuard base, then a chain ending in one, with
        # "exit at the base" and a target through it — both lines must answer every
        # time. The client is the suggested Xray, the peer the suggested sing-box. The
        # two hops stand for remote servers and run Xray 26.3.27: with the hops on
        # 26.9.30 nothing passes through them in this harness, whatever the client.
        # Then the same with Xray-PattN as the client: 26.9.22 could not bring up a
        # WireGuard whose endpoint is an IP (XTLS/Xray-core#6803, fixed by #6804 from
        # the fork's 26.9.24), and the app writes endpoints as IPs — so it gates too.
        if: ${{ !cancelled() }}
        timeout-minutes: 12
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/h"
          curl -fsSL --retry 3 -o h.zip "https://github.com/XTLS/Xray-core/releases/download/v26.3.27/Xray-linux-64.zip"
          unzip -q h.zip -d "$RUNNER_TEMP/h" && chmod +x "$RUNNER_TEMP/h/xray"
          IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" node scripts/probe-wg-base.js
          IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" IRNF_PROBE_PORT=21900 IRNF_PROBE_ROUNDS=3 node scripts/probe-wg-base.js
      - name: A WARP on WireGuard rides a config, as + WARP chains it (a real peer, loopback)
        # scripts/probe-warp-chain.js: the WireGuard server warp.js writes for a chained
        # account (reserved, MTU 1280, no noise) behind a VLESS hop, against a sing-box
        # peer standing in for Cloudflare's edge — selected as the chain, then as an
        # advanced-routing target. Nothing reaches Cloudflare. The hop runs 26.3.27, as
        # in the step above (which fetched it); the client is the suggested Xray, then
        # the suggested Xray-PattN.
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" node scripts/probe-warp-chain.js
          IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" IRNF_PROBE_PORT=22200 node scripts/probe-warp-chain.js
      - name: A group spreads connections over its live members, wherever it is used (real servers, loopback)
        # scripts/probe-group.js: the app's own builder (groups.groupRecord → configBuilder)
        # against local VLESS servers — the group selected, as an advanced-routing target,
        # as a chain's first hop and as its exit, and [group → WireGuard] against a real
        # sing-box peer (the WireGuard built once); round-robin across two live members, a
        # dead one left out by the health check. Nothing reaches the internet. The servers
        # run 26.3.27 (fetched by the WireGuard step above), the client the suggested
        # Xray, then the suggested Xray-PattN.
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          set -euo pipefail
          IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" node scripts/probe-group.js
          IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" IRNF_PROBE_PORT=22500 node scripts/probe-group.js
      - name: A chain carries a closed connection to its last byte, a group in it or not (real servers, loopback)
        # scripts/probe-chain-tail.js: 256 KB pages that close when sent, through a ws hop
        # — [H → S1], [H → group], [group → S3] as the app builds them, every page whole
        # and through the chain relay (configBuilder.relayHopDials). Straight through the
        # hop the core cut about half of them short; the probe says how many it still
        # does, for the record. The servers run 26.3.27, the client the suggested Xray,
        # then the suggested Xray-PattN; both always run.
        if: ${{ !cancelled() }}
        timeout-minutes: 6
        run: |
          rc=0
          IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" node scripts/probe-chain-tail.js || rc=1
          IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_HOP_EXE="$RUNNER_TEMP/h/xray" IRNF_PROBE_PORT=22700 node scripts/probe-chain-tail.js || rc=1
          exit $rc
      - name: MASQUE carries TCP and UDP over HTTP/3 and HTTP/2 (a real server, loopback)
        # scripts/probe-masque.js: a MASQUE server (Xray's masque inbound, IETF
        # CONNECT-IP, RFC 9484) and a client through it, both the core under test,
        # with a certificate that core made and the client pins. HTTP/3 and HTTP/2
        # against one server port: a page every round, the same over IPv6, 2 MB in
        # one piece, UDP echoed through SOCKS5 UDP ASSOCIATE — and a wrong password
        # gets nothing on either. The app does not write MASQUE yet (the client
        # config is written by hand); this is the proof the suggested cores carry
        # the tunnel before it does. Then the same on Xray-PattN; both always run.
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: |
          rc=0
          IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" node scripts/probe-masque.js || rc=1
          IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_PROBE_PORT=22000 node scripts/probe-masque.js || rc=1
          exit $rc
      - name: An ECH outbound fetches the ECH key through fronted DoH (Cloudflare, the real network)
        # scripts/probe-ech-outbound.js: the key of cloudflare-ech.com asked over
        # h2c of 1.1.1.1 through the editor's Example outbound (TLS to 1.1.1.1:443
        # as www.microsoft.com, the certificate checked as the resolver's own),
        # the config through the app's own applyEchOutbounds — then
        # cloudflare-ech.com/cdn-cgi/trace must say sni=encrypted. The same query
        # without the outbound is the control: it must get no key. Both cores.
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          rc=0
          IRNF_PROBE_LOG=info IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" node scripts/probe-ech-outbound.js || rc=1
          IRNF_PROBE_LOG=info IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_PROBE_PORT=22810 node scripts/probe-ech-outbound.js || rc=1
          exit $rc
      - name: LAN users ride their own configs by username and password (real servers, loopback)
        # scripts/probe-lan-users.js: the app's own buildConfig with settings.modules.lanUsers
        # and the store's lanUsers (the users module) — users on local VLESS servers, each
        # account riding its own server over the users' SOCKS5 and HTTP inbounds while the
        # app's own port keeps the main connection; a wrong password, a disabled and an
        # expired user refused; each user's bytes in /debug/vars; the module off writes the
        # config of before. Nothing reaches the internet. The suggested Xray, then the
        # suggested Xray-PattN; both always run.
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        run: |
          rc=0
          IRNF_LU_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" node scripts/probe-lan-users.js || rc=1
          IRNF_LU_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_PROBE_PORT=23600 node scripts/probe-lan-users.js || rc=1
          exit $rc
      - name: TUIC and AnyTLS carry TCP and UDP as the app writes them, on sing-box (real servers, loopback)
        # scripts/probe-tuic-anytls.js: the app's own sing-box config (a server parsed
        # from a share link, singboxBuilder.buildSingboxConfig) against sing-box's own
        # tuic and anytls inbounds, on a certificate sing-box made, the links asking for
        # allow insecure as such links do. TUIC in both UDP relay modes (one with no ALPN
        # in its link, the builder's h3), AnyTLS over its TCP stream: a page every round,
        # 1 MB in one piece, UDP echoed through SOCKS5 UDP ASSOCIATE — and a wrong
        # password gets nothing. No Xray core has either protocol: sing-box is the only
        # place the app's TUIC and AnyTLS are ever run. Nothing reaches the internet.
        if: ${{ !cancelled() }}
        timeout-minutes: 4
        run: IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" node scripts/probe-tuic-anytls.js

  tun-dns:
    # The real TUN, which `sing-box check` cannot speak for: does a name asked
    # through the app's sing-box TUN reach Xray (the managed DNS, a WireGuard's
    # private names) — or does sing-box answer it itself and send it past the
    # tunnel, as 1.14's default dns_mode "hijack" does? In a network namespace of
    # its own (the runner's network is not touched), with the app's own configs
    # (scripts/tun-dns-probe.js). Both lines the app runs: the last 1.13 and the
    # 1.14 GitHub calls latest. On 1.14 a control run without dns_mode must show
    # the bug, or the probe could not see it.
    name: real TUN DNS (sing-box ${{ matrix.singbox }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        singbox: ['1.13.14', '1.14.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Xray (suggested) and sing-box ${{ matrix.singbox }}
        run: |
          set -euo pipefail
          XV=$(node -p "require('./src/main/coreVersions').SUGGESTED.xray")
          SV='${{ matrix.singbox }}'
          echo "xray $XV · sing-box $SV"
          mkdir -p "$RUNNER_TEMP/x" "$RUNNER_TEMP/s"
          curl -fsSL --retry 3 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v$XV/Xray-linux-64.zip"
          unzip -q x.zip -d "$RUNNER_TEMP/x"
          curl -fsSL --retry 3 -o s.tgz "https://github.com/SagerNet/sing-box/releases/download/v$SV/sing-box-$SV-linux-amd64.tar.gz"
          tar -xzf s.tgz -C "$RUNNER_TEMP/s" --strip-components=1
          chmod +x "$RUNNER_TEMP/x/xray" "$RUNNER_TEMP/s/sing-box"
      - name: A name asked through the TUN reaches Xray and never the ISP resolver
        run: sudo IRNF_TUN_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" "$(command -v node)" scripts/tun-dns-probe.js

  multiwan:
    # Two internets at once (settings.multiWan) on real links: WHICH link
    # carried the bytes is what no config check can say. Two network
    # namespaces of their own (the runner's network is not touched): the
    # client's, with two veth links to the server's — A (mwa0, the route the
    # OS prefers) and B (mwb0, behind it) — and one server address reached
    # over both. The client config is the app's own buildConfig with multiWan
    # (links mwa0 and mwb0), and the links' byte counters must say: balance
    # spreads 8 parallel downloads over both links; failover rides its primary
    # B though the OS would pick A, moves to A when B goes down and comes back
    # to B when it returns; split (XHTTP) sends an upload by one link and its
    # download by the other, both ways round; and a control with multiWan off
    # rides A alone, or the counters could not tell (scripts/probe-multiwan.js).
    # The suggested Xray, then the suggested Xray-PattN; both always run.
    name: two internets at once (real links, network namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the suggested Xray and Xray-PattN
        run: |
          set -euo pipefail
          XV=$(node -p "require('./src/main/coreVersions').SUGGESTED.xray")
          PV=$(node -p "require('./src/main/coreVersions').SUGGESTED['xray-pattn']")
          echo "xray $XV · xray-pattn $PV"
          mkdir -p "$RUNNER_TEMP/x" "$RUNNER_TEMP/p"
          curl -fsSL --retry 3 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v$XV/Xray-linux-64.zip"
          unzip -q x.zip -d "$RUNNER_TEMP/x"
          curl -fsSL --retry 3 -o p.zip "https://github.com/patterniha/Xray-core/releases/download/v$PV/Xray-linux-64.zip"
          unzip -q p.zip -d "$RUNNER_TEMP/p"
          chmod +x "$RUNNER_TEMP/x/xray" "$RUNNER_TEMP/p/xray"
      - name: Xray (suggested) balances, fails over and splits over two links
        # the probe stops itself at 4 minutes and removes its namespaces whatever happened
        timeout-minutes: 5
        run: sudo IRNF_MW_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" "$(command -v node)" scripts/probe-multiwan.js
      - name: Xray-PattN (suggested) balances, fails over and splits over two links
        # also when the official core failed: one run says it for both
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: sudo IRNF_MW_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_PROBE_PORT=23300 "$(command -v node)" scripts/probe-multiwan.js

  lan-users:
    # People behind the router as users (settings.modules.lanUsers, transparent
    # mode): WHICH server a device's bytes reached, whether a device nobody owns
    # sees the login page and nothing else, whether a blocked or capped one gets
    # nothing — what a device sees, which no config check can say. Five network
    # namespaces of their own (the runner's network is not touched): three devices
    # with fixed MACs on a bridge; the router — the app's nft table and sing-box
    # TUN through TunOpenwrt, Xray from buildConfig, the login portal; and the
    # internet with three servers. An assigned device rides its user's server,
    # an unassigned one gets the login page on http and nothing else until it
    # logs in, then its user's server; a blocked device and one whose user is
    # over its cap get nothing; a device that takes an assigned one's address
    # gets nothing (each user's device's address is pinned to its MAC in nft);
    # the module off is today's gateway, byte for byte
    # (scripts/probe-lan-portal.js). Both sing-box lines the app runs — a rule by
    # source MAC exists only from 1.14 — and on each the suggested Xray, then the
    # suggested Xray-PattN; both always run.
    name: LAN users on the router (sing-box ${{ matrix.singbox }}, network namespaces)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        singbox: ['1.13.14', '1.14.3']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch the suggested Xray and Xray-PattN, and sing-box ${{ matrix.singbox }}
        run: |
          set -euo pipefail
          XV=$(node -p "require('./src/main/coreVersions').SUGGESTED.xray")
          PV=$(node -p "require('./src/main/coreVersions').SUGGESTED['xray-pattn']")
          SV='${{ matrix.singbox }}'
          echo "xray $XV · xray-pattn $PV · sing-box $SV"
          mkdir -p "$RUNNER_TEMP/x" "$RUNNER_TEMP/p" "$RUNNER_TEMP/s"
          curl -fsSL --retry 3 -o x.zip "https://github.com/XTLS/Xray-core/releases/download/v$XV/Xray-linux-64.zip"
          unzip -q x.zip -d "$RUNNER_TEMP/x"
          curl -fsSL --retry 3 -o p.zip "https://github.com/patterniha/Xray-core/releases/download/v$PV/Xray-linux-64.zip"
          unzip -q p.zip -d "$RUNNER_TEMP/p"
          curl -fsSL --retry 3 -o s.tgz "https://github.com/SagerNet/sing-box/releases/download/v$SV/sing-box-$SV-linux-amd64.tar.gz"
          tar -xzf s.tgz -C "$RUNNER_TEMP/s" --strip-components=1
          chmod +x "$RUNNER_TEMP/x/xray" "$RUNNER_TEMP/p/xray" "$RUNNER_TEMP/s/sing-box"
      - name: nft for the router's table
        run: command -v nft >/dev/null || { sudo apt-get update && sudo apt-get install -y nftables; }
      - name: Smooth speed limits — router/shaper.js shapes a device with tc on the LAN bridge (a 2000 kbit cap within ±25 % and smoother than nft policing), a 'high' device beats a 'low' one (network namespaces)
        # scripts/probe-lan-shape.js: the module's own commands (HTB on the LAN device, ingress + IFB for the
        # upload) run inside a router namespace; needs the runner's tc and sched modules, nft for the comparison.
        # Independent of sing-box: one run of the matrix is enough
        if: ${{ matrix.singbox == '1.14.3' && !cancelled() }}
        timeout-minutes: 6
        run: sudo IRNF_LS_PROBE=1 "$(command -v node)" scripts/probe-lan-shape.js
      - name: Xray (suggested) — devices ride their users' servers, the login page, blocks and caps
        # the probe stops itself at 6.5 minutes and removes its namespaces whatever happened
        timeout-minutes: 8
        run: sudo IRNF_LP_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/x/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" "$(command -v node)" scripts/probe-lan-portal.js
      - name: Xray-PattN (suggested) — devices ride their users' servers, the login page, blocks and caps
        # also when the official core failed: one run says it for both
        if: ${{ !cancelled() }}
        timeout-minutes: 8
        run: sudo IRNF_LP_PROBE=1 IRNF_XRAY_EXE="$RUNNER_TEMP/p/xray" IRNF_SINGBOX_EXE="$RUNNER_TEMP/s/sing-box" IRNF_PROBE_PORT=23900 "$(command -v node)" scripts/probe-lan-portal.js

  android:
    # The Android app is a hand-written port of src/main/parser.js and
    # configBuilder.js, and nobody working on it can compile Kotlin locally
    # (no JDK, no Gradle, and the wrapper is not committed). Without this job a
    # broken port only surfaces when someone pushes a release tag. Compile only —
    # no signing, no APK upload; release.yml still owns the shipped build.
    name: compile android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          # An explicit package list, because the action's default is
          # `tools platform-tools` and Google removed the deprecated `tools`
          # package from the SDK repository (android-actions/setup-android
          # #537, #538, filed 2026-09-15/16). Every Android job started
          # failing at SDK setup on 2026-09-16 with no change of ours; the
          # Gradle build downloads the platform and build-tools it needs by
          # itself, so platform-tools is all this step has to install.
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch native libs (libv2ray)
        run: bash scripts/fetch-libs.sh
      - name: Compile
        # assembleDebug, not assembleRelease: the point is "does the Kotlin
        # compile and link against libv2ray", not producing an artifact.
        run: gradle --no-daemon assembleDebug
      - name: Unit tests (the pure core against the desktop's pins)
        run: gradle --no-daemon testDebugUnitTest
      - name: Unit test results (fail when nothing ran)
        # Gradle exits 0 for an empty test source set, and the console shows
        # no per-test lines on success — so a misplaced test directory would
        # pass this job silently. Count the testcases in the JUnit XML instead.
        run: |
          set -e
          files=$(ls app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null || true)
          test -n "$files" || { echo "no JUnit result files"; exit 1; }
          total=0
          for f in $files; do
            n=$(grep -o '<testcase ' "$f" | wc -l)
            bad=$(grep -o '<failure' "$f" | wc -l)
            echo "$(basename "$f" .xml): $n tests, $bad failures"
            total=$((total + n))
          done
          echo "total: $total"
          test "$total" -gt 0

  openwrt:
    # The OpenWrt package runs nowhere but a router, and nobody working on it
    # has one on the desk. So an OpenWrt 24.10 armsr image boots in QEMU (TCG,
    # slow), the package installs on top of the feed's node, and the gateway is
    # asked to come up against a SOCKS upstream that does not exist: the TUN
    # device, sing-box's policy route, our nft table and the fw4 zone are what
    # is asserted — not internet. openwrt/ci/guest-smoke.sh is the checklist.
    #
    # Two releases, because their feeds carry different nodes: 24.10 has node
    # 20, 23.05 has node 18 — and the owner's router runs 23.05. The runtime
    # uses nothing newer than Node 18, and this is where that stays true.
    name: openwrt (qemu armsr-armv7, ${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        release: ['24.10.2', '23.05.5']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install QEMU
        run: sudo apt-get update && sudo apt-get install -y qemu-system-arm
      - name: Build the package
        run: node openwrt/build-ipk.js dist
      - name: Keep the package (a testable ipk from every push, without a tag)
        if: matrix.release == '24.10.2'
        uses: actions/upload-artifact@v4
        with:
          name: IRNetFree-OpenWrt-dev
          path: dist/irnetfree_*_all.ipk
          if-no-files-found: error
      - name: Fetch the OpenWrt image
        run: curl -fsSL -o /tmp/openwrt-kernel.bin "https://downloads.openwrt.org/releases/${{ matrix.release }}/targets/armsr/armv7/openwrt-${{ matrix.release }}-armsr-armv7-generic-initramfs-kernel.bin"
      - name: Boot, install, connect, assert
        run: node openwrt/ci/qemu-smoke.js --kernel /tmp/openwrt-kernel.bin --ipk "$(ls dist/irnetfree_*_all.ipk)"
