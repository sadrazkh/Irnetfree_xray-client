name: Tests

# Unit tests on every push and PR, on all three desktop platforms — the parser,
# config builder and engine choice must behave identically everywhere.
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    name: node --test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22+: `node --test "tests/*.test.js"` needs glob support (added in Node 21).
          node-version: '22'
      # No `npm ci` on purpose — the tests use only Node core modules.
      - run: npm test

  android:
    # The Android app is a hand-written port of src/main/parser.js and
    # configBuilder.js, and nobody working on it can compile Kotlin locally
    # (no JDK, no Gradle, and the wrapper is not committed). Without this job a
    # broken port only surfaces when someone pushes a release tag. Compile only —
    # no signing, no APK upload; release.yml still owns the shipped build.
    name: compile android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Fetch native libs (libv2ray)
        run: bash scripts/fetch-libs.sh
      - name: Compile
        # assembleDebug, not assembleRelease: the point is "does the Kotlin
        # compile and link against libv2ray", not producing an artifact.
        run: gradle --no-daemon assembleDebug
