<!doctype html>
<!-- Source of assets/og.png (1200×630, the link preview). Not published: build-site.js skips names that start
     with "_". Re-render: open at 1200×630 in headless Chrome and capture the page. -->
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative; font-family: "Segoe UI", Vazirmatn, Tahoma, sans-serif; color: #e8eef4;
    background: radial-gradient(700px 500px at 88% 10%, rgb(45 212 191 / .22), transparent 60%),
                radial-gradient(600px 460px at 0% 110%, rgb(79 140 255 / .22), transparent 60%), #0a0f15;
  }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(rgb(255 255 255 / .045) 1px, transparent 1px), linear-gradient(90deg, rgb(255 255 255 / .045) 1px, transparent 1px); background-size: 44px 44px; }
  .bar { position: absolute; top: 0; left: 0; right: 0; height: 6px; background: linear-gradient(90deg, #2dd4bf, #4f8cff); }
  .wrap { position: absolute; left: 80px; top: 92px; right: 80px; }
  .row { display: flex; align-items: center; gap: 28px; }
  .row img { width: 132px; height: 132px; }
  .name { font-size: 104px; font-weight: 800; letter-spacing: -2px; line-height: 1; }
  .name b { background: linear-gradient(110deg, #2dd4bf, #4f8cff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .fa { margin-top: 70px; font-size: 50px; font-weight: 800; direction: rtl; text-align: left; unicode-bidi: plaintext; }
  .en { margin-top: 10px; font-size: 32px; color: #a9b8c8; }
  .chips { position: absolute; left: 80px; bottom: 64px; display: flex; gap: 14px; }
  .chips span { padding: 10px 22px; border-radius: 999px; border: 1px solid #2a3a4d; background: rgb(17 26 36 / .8); font-size: 24px; font-weight: 600; color: #c8d5e0; }
  .power { position: absolute; right: 96px; top: 60px; width: 200px; height: 200px; border-radius: 50%; background: #2dd4bf; box-shadow: 0 0 0 18px rgb(45 212 191 / .14), 0 0 90px rgb(45 212 191 / .55); display: grid; place-items: center; }
  .power svg { width: 92px; height: 92px; }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="bar"></div>
  <div class="power"><svg viewBox="0 0 24 24" fill="none" stroke="#06241f" stroke-width="2.6" stroke-linecap="round"><path d="M12 3v8"/><path d="M17.7 6.6a8 8 0 1 1-11.4 0"/></svg></div>
  <div class="wrap">
    <div class="row"><img src="../assets/logo.svg" alt=""><div class="name">IR<b>NetFree</b></div></div>
    <div class="fa">کلاینت VPN برای همه‌ی دستگاه‌هایت</div>
    <div class="en">A VPN client for every device you own</div>
  </div>
  <div class="chips"><span>Windows</span><span>macOS</span><span>Linux</span><span>Android</span><span>OpenWrt</span></div>
</body>
</html>
